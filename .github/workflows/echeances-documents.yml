name: Échéances documents

# Déclenche l'alerte push des documents à échéance proche via une route API
# Next.js, plutôt qu'un Vercel Cron (pour rester sur le plan gratuit
# Vercel, limité à 2 cron jobs). 6h UTC = 7h (hiver) ou 8h (été) heure de
# Paris — à ajuster si un autre horaire est préféré.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Appelle la route de rappel des échéances documents
        run: |
          curl -f -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://kilio.vercel.app/api/cron/echeances-documents
